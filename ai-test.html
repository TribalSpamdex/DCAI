<!doctype html><html lang="en"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>DCAI iPhone AI proof</title><style>body{background:#101615;color:#eef8f2;font:17px system-ui;max-width:650px;margin:auto;padding:20px}h1{color:#94efb9}button,select,textarea{font:inherit;width:100%;box-sizing:border-box;padding:14px;margin:8px 0;border-radius:10px}button{background:#94efb9;color:#10251a;border:0;font-weight:bold}button:disabled{opacity:.4}pre{white-space:pre-wrap;overflow-wrap:anywhere;background:#1e3028;padding:14px;border-radius:10px}progress{width:100%}small{color:#c0d2c7}</style><h1>DCAI V0.5.1</h1><p>Real on-device AI compatibility test. No API key, paid requests or player data. Use Wi-Fi; model downloads may be several hundred MB or more. Keep Safari open.</p><button id="probe">1. Check device</button><select id="model"><option>SmolLM2-360M-Instruct-q4f16_1-MLC</option><option>Qwen2.5-0.5B-Instruct-q4f16_1-MLC</option><option>Qwen2.5-1.5B-Instruct-q4f16_1-MLC</option></select><button id="load" disabled>2. Download and load model</button><progress id="progress" max="1" value="0"></progress><button id="test" disabled>3. Run conversation tests</button><textarea id="question" placeholder="Ask your own question (no private information)"></textarea><button id="ask" disabled>Ask local AI</button><button id="copy">Copy test report</button><pre id="log" aria-live="polite">Not tested yet.</pre><script type="module">
const $=id=>document.getElementById(id);let engine, busy=false, messages=[], report=[];const log=s=>{report.push(String(s));$('log').textContent=report.join('\n\n')};function state(){for(const id of ['test','ask'])$(id).disabled=busy||!engine;$('load').disabled=busy||!compatible;$('probe').disabled=busy;$('model').disabled=busy}let compatible=false;async function run(fn){if(busy)return;busy=true;state();try{await fn()}catch(e){log('ERROR: '+(e?.message||e))}finally{busy=false;state()}}
$('probe').onclick=()=>run(async()=>{compatible=false;log(navigator.userAgent);log('Secure context: '+isSecureContext);if(!navigator.gpu)throw Error('WebGPU unavailable. Open the HTTPS page in Safari.');const a=await navigator.gpu.requestAdapter();if(!a)throw Error('No GPU adapter');log('GPU adapter: available; shader-f16: '+a.features.has('shader-f16'));if(!a.features.has('shader-f16'))throw Error('Selected model builds require shader-f16');compatible=true;log('GPU precheck passed; inference still untested.')});
$('load').onclick=()=>run(async()=>{if(engine){await engine.unload();engine=null}messages=[];const t=performance.now();const lib=await import('https://cdn.jsdelivr.net/npm/@mlc-ai/web-llm@0.2.85/+esm');const id=$('model').value;if(!lib.prebuiltAppConfig.model_list.some(m=>m.model_id===id))throw Error('Model missing in pinned runtime');engine=await lib.CreateMLCEngine(id,{initProgressCallback:p=>{$('progress').value=p.progress;$('log').textContent=report.join('\n\n')+'\n\n'+p.text}});log('MODEL LOADED: '+id+' in '+((performance.now()-t)/1000).toFixed(1)+'s')});
async function ask(q){const t=performance.now();const next=[...messages,{role:'user',content:q}];const r=await engine.chat.completions.create({messages:next,temperature:0,max_tokens:120});const answer=r.choices[0]?.message?.content;if(typeof answer!=='string'||!answer.trim())throw Error('Empty model answer');messages=[...next,{role:'assistant',content:answer}].slice(-6);log('Q: '+q+'\nAI: '+answer+'\nTime: '+((performance.now()-t)/1000).toFixed(1)+'s; output tokens: '+(r.usage?.completion_tokens??'unknown'));return answer}
$('test').onclick=()=>run(async()=>{messages=[];const nonce='CEDAR-'+Math.floor(1000+Math.random()*9000);await ask('Remember this test code: '+nonce+'. Reply OK.');const a=await ask('What was my test code? Reply with the code only.');log('Recall check: '+(a.includes(nonce)?'PASS':'FAIL'));messages=[];await ask('In darts, double-out, I have 40 remaining. What single dart finishes the leg?');await ask('If I miss that double and hit single 20, what double finishes the leg?');await ask('I have no recorded doubles data. Can you calculate my personal double 16 accuracy? Explain briefly.');log('Generation completed. Manually check answers: D20, D10, insufficient data. This is not a coaching quality certification.');});$('ask').onclick=()=>run(async()=>{const q=$('question').value.trim();if(q)await ask(q)});$('copy').onclick=async()=>{try{await navigator.clipboard.writeText(report.join('\n\n'))}catch{log('Clipboard unavailable; select the report manually.')}};state();
</script></html>
